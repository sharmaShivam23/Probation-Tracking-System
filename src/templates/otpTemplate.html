<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your OTP Code</title>
    <style>
      body, table, td { margin:0; padding:0; }
      body { background:#000; font-family:Arial,Helvetica,sans-serif; }

      .container { width:100%; max-width:600px; margin:0 auto; background:#111; border-radius:12px; overflow:hidden; }

      .header { background:#7f1d1d; padding:18px; text-align:center; }
      .header h1 { margin:0; color:#fff; font-size:22px; font-weight:700; letter-spacing:1px; }

      .content { padding:28px 24px; }
      .subtext { font-size:14px; color:#aaa; margin:0 0 20px; text-align:center; }

      .otp {
        background:#1a1a1a;
        color:#fff;
        border-radius:8px;
        padding:20px;
        font-size:28px;
        font-weight:700;
        text-align:center;
        letter-spacing:4px;
        border:1px solid rgba(255,255,255,0.1);
        margin:20px 0;
        user-select: all; /* allows click+copy */
      }

      .instruction { font-size:14px; color:#ccc; text-align:center; margin-bottom:24px; }

      .btn {
        display:inline-block;
        margin-top:10px;
        padding:12px 22px;
        background:#7f1d1d;
        color:#fff !important;
        font-weight:700;
        font-size:14px;
        border-radius:8px;
        text-decoration:none;
      }
      .btn:hover { background:#a11c1c; }

      .footer { border-top:1px solid rgba(255,255,255,0.08); text-align:center; padding:18px; font-size:12px; color:#666; }

      @media screen and (max-width:600px) {
        .header h1 { font-size:18px; }
        .content { padding:20px 16px; }
        .otp { font-size:24px; padding:16px; letter-spacing:3px; }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Your OTP Code</h1>
      </div>

      <div class="content">
        <p class="subtext">Use the following One-Time Password (OTP) to complete your login or verification process.</p>

        <!-- OTP -->
        <div class="otp">{{otp}}</div>

        <p class="instruction">This OTP is valid for 5 minutes. Do not share it with anyone.</p>

        <!-- "Copy OTP" button (just a visual button, user can select text manually) -->
        <div style="text-align:center;">
          <a class="btn">Copy OTP</a>
          <p style="color:#888; font-size:12px; margin-top:8px;">(Select & copy the OTP above)</p>
        </div>
      </div>

      <div class="footer">
        © {{year}} TaskSphere — All rights reserved
      </div>
    </div>
  </body>
</html>
