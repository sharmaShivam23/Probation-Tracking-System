version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci             # Cleaner install than 'npm install'
        - npm run lint       # Fails build if linting fails
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/* # Speeds up subsequent builds